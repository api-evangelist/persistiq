aid: persistiq
name: PersistIQ
description: >-
  PersistIQ is a sales engagement platform for small teams to find new
  customers, start conversations, and personalize sales outreach at scale from
  one place. It combines prospect research (Chrome extension), multi-channel
  outreach (email, calls, tasks), campaign management with A/B testing,
  performance analytics, and CRM integrations. PersistIQ exposes a REST API (v1)
  for users, leads (prospects), lead statuses and fields, campaigns, activity
  events, and Do Not Contact domains, authenticated with a company-wide API key
  sent in the x-api-key header, with cursor pagination and a 100 request/minute
  per-key rate limit.
