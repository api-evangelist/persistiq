aid: persistiq
name: PersistIQ
description: >-
  PersistIQ is a sales engagement platform for small teams to find new
  customers, start conversations, and personalize sales outreach at scale from
  one place. It combines prospect research (Chrome extension), multi-channel
  outreach (email, calls, tasks), campaign management with A/B testing,
  performance analytics, and CRM integrations. PersistIQ exposes a REST API (v1)
  for users, leads (prospects), lead statuses and fields, tags, campaigns
  (including duplication and inbox replies), activity events, Do Not Contact
  domains, and a webhook plugin carrying five events. It is specified by
  PersistIQ's own OpenAPI 3.0.1 document, served from the API host at
  /api-docs/v1/swagger.json. Authentication is a single company-wide API key sent
  in the x-api-key header, with page-number pagination and a documented 100
  request/minute per-key rate limit.
