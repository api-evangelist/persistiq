  date: '2026-08-13'
  status: enriched
  artifacts_added: 5
  pass: local-v1
  note: >-
    Round 2. Located PersistIQ's own OpenAPI 3.0.1 document at
    https://api.persistiq.com/api-docs/v1/swagger.json — reachable from the
    Swagger UI on the API host root, and never linked from the published API
    reference. It adds four surfaces the derived spec did not have (tags,
    campaign create/duplicate, campaign replies, webhook plugin) and replaced
    the derived spec as the evidence base for authentication, conformance,
    errors, data-model and conventions. The WellKnown pointer was REMOVED: every
    /.well-known/ path 404s on both hosts, so the pointer asserted a surface
    PersistIQ does not serve.
