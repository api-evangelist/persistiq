  - reason: api_error
    description: A generic API error.
  - reason: bad_params
    description: A required parameter is missing or invalid.
  - reason: invalid_request
    description: The request could not be processed (e.g. validation failure).
  - reason: too_many_requests
    description: Rate limit exceeded (see 429).
