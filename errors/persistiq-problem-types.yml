notes: >-
  PersistIQ returns a custom JSON error envelope (not RFC 9457
  application/problem+json). Single-object errors use `error`; batch operations
  (create leads, add leads to campaign) return an `errors` array with per-item
  `reason`, `message`, and the offending object. `reason` describes the error
  type; `message` is a human-readable, user-friendly description.
